# Where every file under assets/ comes from -- see README.md ("Asset sources").
# tests/test_sources.py keeps this complete, and scripts/gen_credits.py builds
# CREDITS.md's asset section from it. A pack's license text is in
# licenses/assets/<pack>.txt.
#
# source: a pack slug from `packs`, "own" (made for this game), or "unknown"
#         (origin not yet confirmed; then `todo` says what to do).
# original: the file's path inside that pack. modified: what was changed.

packs:
  kenney-mobile-controls:
    name: "Mobile Controls"
    author: "Kenney"
    url: https://kenney.nl/assets/mobile-controls
    license: CC0-1.0
    used_for: "touch controls"
  kenney-particle-pack:
    name: "Particle Pack"
    author: "Kenney"
    url: https://kenney.nl/assets/particle-pack
    license: CC0-1.0
    used_for: "muzzle flashes"
  kenney-top-down-shooter:
    name: "Top-Down Shooter"
    author: "Kenney"
    url: https://kenney.nl/assets/top-down-shooter
    license: CC0-1.0
    used_for: "characters, weapons, map tiles"
  kenney-ui-pack:
    name: "UI Pack"
    author: "Kenney"
    url: https://kenney.nl/assets/ui-pack
    license: CC0-1.0
    used_for: "button sounds"

